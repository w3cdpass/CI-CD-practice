name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # ← Ensures full history and files are fetched
      
      - name: Verify lockfile
        run: ls -la && [ -f package-lock.json ] || exit 1
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci --prefer-offline
      
      - name: Run Linter
        run: npm run lint

  build-and-deploy:
    name: Build and Deploy
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Verify lockfile
        run: ls -la && [ -f package-lock.json ] || exit 1
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Clean workspace
        run: rm -rf dist/* || true
      
      - name: Install and Build
        run: |
          npm ci --prefer-offline
          npm run build
      
      - name: Verify build output
        run: |
          ls -la dist/
          [ -f dist/index.html ] || exit 1
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false